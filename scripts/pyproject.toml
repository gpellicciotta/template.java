# Ruff and pytest configuration for scripts/; Gradle owns the Java project metadata at the repository root.

[tool.ruff]
target-version = "py39"
line-length = 132

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --timeout=30 -m 'not slow'"
markers = [
  "slow: integration, end-to-end, browser, or build tests, or tests taking over 5 seconds",
]
