plugins {
  id 'application'
  id 'checkstyle'
  alias(libs.plugins.spotless)
}

// group, version, author, and copyright are read from gradle.properties - the single source of truth, read back
// at runtime via the jar manifest, see Cli.java.
ext.vendor = author
ext.copyright = copyright

repositories {
  mavenCentral()
  // support.java is published to GitHub Packages (see docs/devops.md, section "Prerequisites and Environment").
  // Credentials come from {user.home}/.gradle/gradle.properties or GITHUB_USERNAME/GITHUB_TOKEN env vars; a PAT
  // needs read:packages.
  maven {
    url = 'https://maven.pkg.github.com/gpellicciotta/support.java'
    credentials {
      username = project.findProperty("github.username") ?: System.getenv("GITHUB_USERNAME")
      password = project.findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
    }
  }
}

dependencies {
  implementation     libs.support.java
  testImplementation libs.junit.jupiter.api
  testRuntimeOnly    libs.junit.jupiter.engine
  // Gradle 9 no longer bundles the JUnit Platform launcher - must be declared explicitly.
  testRuntimeOnly    libs.junit.platform.launcher
}

java {
  // A toolchain (rather than source/targetCompatibility) decouples the JDK used to compile from the JDK
  // running Gradle, and compiles with --release semantics so use of APIs newer than the target is caught at
  // build time. Keep in sync with gradle/gradle-daemon-jvm.properties's toolchainVersion.
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
  withJavadocJar()
  withSourcesJar()
}

// Generate HTML5 documentation without doclint diagnostics or Javadoc progress messages.
javadoc {
  options.addBooleanOption('html5', true)
  options.addStringOption('Xdoclint:none', '-quiet')
}

application {
  mainClass = 'myproject.Cli'
}

// Style rules Spotless cannot enforce (braces, Javadoc, package-info) - see config/checkstyle/checkstyle.xml.
checkstyle {
  toolVersion = libs.versions.checkstyle.get()
  maxWarnings = 0
}

def generateTestServices = tasks.register('generateTestServices') {
  def outputDir = layout.buildDirectory.dir('generated/test-services')
  outputs.dir(outputDir)
  doLast {
    def serviceFile = outputDir.get().file('META-INF/services/org.junit.jupiter.api.extension.Extension').asFile
    serviceFile.parentFile.mkdirs()
    serviceFile.setText('myproject.StateLeakGuard\n', 'UTF-8')
  }
}

sourceSets.test.output.dir(generateTestServices)

def repoRootPath = projectDir.absolutePath
tasks.withType(Test).configureEach {
  def isolatedHomeDir = layout.buildDirectory.dir("tmp/${name}-user-home")
  def initialHomeFile = isolatedHomeDir.get().asFile
  def initialHomePath = initialHomeFile.absolutePath
  environment 'HOME', initialHomePath
  environment 'USERPROFILE', initialHomePath
  environment 'XDG_CONFIG_HOME', new File(initialHomeFile, '.config').absolutePath
  environment 'XDG_CACHE_HOME', new File(initialHomeFile, '.cache').absolutePath
  environment 'XDG_DATA_HOME', new File(initialHomeFile, '.local/share').absolutePath
  environment 'XDG_STATE_HOME', new File(initialHomeFile, '.local/state').absolutePath
  environment 'APPDATA', new File(initialHomeFile, 'AppData/Roaming').absolutePath
  environment 'LOCALAPPDATA', new File(initialHomeFile, 'AppData/Local').absolutePath
  if (initialHomePath.length() >= 2 && initialHomePath.charAt(1) == (char) ':') {
    environment 'HOMEDRIVE', initialHomePath.substring(0, 2)
    environment 'HOMEPATH', initialHomePath.substring(2)
  }
  doFirst {
    def home = isolatedHomeDir.get().asFile
    home.deleteDir()
    home.mkdirs()
  }
  testLogging {
    events 'passed', 'skipped', 'failed'
    showStandardStreams = true
    info.events = events
  }
  systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
  systemProperty 'junit.jupiter.execution.parallel.config.executor-service', 'FORK_JOIN_POOL'
  jvmArgumentProviders.add({
    def homePath = isolatedHomeDir.get().asFile.absolutePath
    [
      "-Duser.home=${homePath}".toString(),
      "-Dmyproject.isolated.home=${homePath}".toString(),
      "-Dmyproject.repo.root=${repoRootPath}".toString()
    ]
  } as CommandLineArgumentProvider)
}

tasks.named('test') {
  timeout = java.time.Duration.ofMinutes(5)
  useJUnitPlatform { excludeTags 'slow' }
  systemProperty 'junit.jupiter.execution.timeout.default', '30 s'
  systemProperty 'junit.jupiter.execution.timeout.lifecycle.method.default', '30 s'
  systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
  systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
}

def jarArchive = tasks.named('jar').flatMap { it.archiveFile }
tasks.register('slowTest', Test) {
  description = 'Runs the slow test suite.'
  group = 'verification'
  timeout = java.time.Duration.ofMinutes(10)
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  dependsOn tasks.named('jar')
  inputs.file(jarArchive)
    .withPropertyName('applicationJar')
    .withPathSensitivity(PathSensitivity.NONE)
  useJUnitPlatform { includeTags 'slow' }
  systemProperty 'junit.jupiter.execution.timeout.default', '120 s'
  systemProperty 'junit.jupiter.execution.timeout.lifecycle.method.default', '120 s'
  systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
  systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
  jvmArgumentProviders.add({
    ["-Dtest.jar.path=${jarArchive.get().asFile.absolutePath}".toString()]
  } as CommandLineArgumentProvider)
}

tasks.named('check') { dependsOn 'slowTest' }

// Formatting: normalizes whitespace only (trailing whitespace, final newline, tabs-to-spaces), deliberately
// not a full reformatter (googleJavaFormat/eclipse). `check` already depends on `spotlessCheck` via the
// plugin's own wiring.
spotless {
  java {
    target 'src/**/*.java'
    trimTrailingWhitespace()
    endWithNewline()
    leadingTabsToSpaces(2)
  }
  groovyGradle {
    target '*.gradle', 'gradle/*.gradle'
    trimTrailingWhitespace()
    endWithNewline()
    leadingTabsToSpaces(2)
  }
}

// Short commit hash of the current HEAD, or null outside a git checkout (e.g. a source-only tarball build):
def gitCommitHash = {
  try {
    def process = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, projectDir)
    process.waitFor()
    return process.exitValue() == 0 ? process.text.trim() : null
  } catch (IOException ignored) {
    return null
  }
}()

// Implementation-Version carries +<short-commit-hash> build metadata so in-development builds sharing the
// same -pre version stay individually traceable back to the commit that produced them:
def implementationVersion = gitCommitHash ? "${project.version}+${gitCommitHash}" : project.version.toString()

// Stamps the resolved project version, vendor, and copyright notice into the jar manifest so Cli.java can read
// them back at runtime - this is the single source of truth, with no hardcoded version/author strings to keep in
// sync (mirrors the Python template's importlib.metadata.version() approach). Main-Class makes the plain jar
// directly runnable via `java -jar` (the 'application' plugin's own mainClass setting only wires up the 'run'
// task and the generated start scripts, not the jar's own manifest).
jar {
  manifest {
    attributes(
      'Main-Class':              application.mainClass.get(),
      'Implementation-Title':    project.name,
      'Implementation-Version':  implementationVersion,
      'Implementation-Vendor':   project.ext.vendor,
      'Copyright':               project.ext.copyright,
      // Deliberately changes on each configuration: prefer build traceability over identical JAR bytes.
      'Build-Time':              java.time.Instant.now().toString()
    )
  }
}

// doFullRelease and its supporting tasks - see gradle/release.gradle and docs/devops.md, section "Release Process".
apply from: "$rootDir/gradle/release.gradle"
