plugins {
  id 'application'
  id 'checkstyle'
  alias(libs.plugins.spotless)
}

// group, version, and author are read from gradle.properties - the single source of truth, read back at
// runtime via the jar manifest, see Cli.java.
ext.vendor = author // Copyright name for the jar manifest - see Cli.java

repositories {
  mavenCentral()
  // support.java is published to GitHub Packages (see docs/devops.md, section "Prerequisites and Environment").
  // Credentials come from {user.home}/.gradle/gradle.properties or GITHUB_USERNAME/GITHUB_TOKEN env vars; a PAT
  // needs read:packages.
  maven {
    url = 'https://maven.pkg.github.com/gpellicciotta/support.java'
    credentials {
      username = project.findProperty("github.username") ?: System.getenv("GITHUB_USERNAME")
      password = project.findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
    }
  }
}

dependencies {
  implementation     libs.support.java
  testImplementation libs.junit.jupiter.api
  testRuntimeOnly    libs.junit.jupiter.engine
  // Gradle 9 no longer bundles the JUnit Platform launcher - must be declared explicitly.
  testRuntimeOnly    libs.junit.platform.launcher
}

java {
  // A toolchain (rather than source/targetCompatibility) decouples the JDK used to compile from the JDK
  // running Gradle, and compiles with --release semantics so use of APIs newer than the target is caught at
  // build time. Keep in sync with gradle/gradle-daemon-jvm.properties's toolchainVersion.
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
  withJavadocJar()
  withSourcesJar()
}

// Generate HTML5 documentation without doclint diagnostics or Javadoc progress messages.
javadoc {
  options.addBooleanOption('html5', true)
  options.addStringOption('Xdoclint:none', '-quiet')
}

application {
  mainClass = 'myproject.Cli'
}

// Style rules Spotless cannot enforce (braces, Javadoc, package-info) - see config/checkstyle/checkstyle.xml.
checkstyle {
  toolVersion = libs.versions.checkstyle.get()
  maxWarnings = 0
}

test {
  useJUnitPlatform()
  testLogging.showStandardStreams = true
}

// Formatting: normalizes whitespace only (trailing whitespace, final newline, tabs-to-spaces), deliberately
// not a full reformatter (googleJavaFormat/eclipse). `check` already depends on `spotlessCheck` via the
// plugin's own wiring.
spotless {
  java {
    target 'src/**/*.java'
    trimTrailingWhitespace()
    endWithNewline()
    leadingTabsToSpaces(2)
  }
  groovyGradle {
    target '*.gradle', 'gradle/*.gradle'
    trimTrailingWhitespace()
    endWithNewline()
    leadingTabsToSpaces(2)
  }
}

// Short commit hash of the current HEAD, or null outside a git checkout (e.g. a source-only tarball build):
def gitCommitHash = {
  try {
    def process = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, projectDir)
    process.waitFor()
    return process.exitValue() == 0 ? process.text.trim() : null
  } catch (IOException ignored) {
    return null
  }
}()

// Implementation-Version carries +<short-commit-hash> build metadata so in-development builds sharing the
// same -pre version stay individually traceable back to the commit that produced them:
def implementationVersion = gitCommitHash ? "${project.version}+${gitCommitHash}" : project.version.toString()

// Stamps the resolved project version (and vendor/copyright name) into the jar manifest so Cli.java can read
// them back at runtime via Package.getImplementationVersion()/getImplementationVendor() - this is the single
// source of truth, there is no second hardcoded version/name string to keep in sync (mirrors the Python
// template's importlib.metadata.version() approach). Main-Class makes the plain jar directly runnable via
// `java -jar` (the 'application' plugin's own mainClass setting only wires up the 'run' task and the generated
// start scripts, not the jar's own manifest).
jar {
  manifest {
    attributes(
      'Main-Class':              application.mainClass.get(),
      'Implementation-Title':    project.name,
      'Implementation-Version':  implementationVersion,
      'Implementation-Vendor':   project.ext.vendor,
      // Deliberately changes on each configuration: prefer build traceability over identical JAR bytes.
      'Build-Time':              java.time.Instant.now().toString()
    )
  }
}

// doFullRelease and its supporting tasks - see gradle/release.gradle and docs/devops.md, section "Release Process".
apply from: "$rootDir/gradle/release.gradle"
