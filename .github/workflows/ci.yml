name: CI
on: [push, pull_request]
jobs:
  test-scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python ships no Python 3.9 for the ubuntu-latest image (Ubuntu 26.04).
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.x'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install script requirements
        run: python -m pip install -r scripts/requirements.txt
      - name: Lint scripts with Ruff
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: Test the devops script
        run: python -m pytest scripts/tests
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install script requirements
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate, build and test
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: python scripts/devops.py check
